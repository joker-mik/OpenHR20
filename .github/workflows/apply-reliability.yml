name: Apply reliability changes

on:
  push:
    branches:
      - reliability-improvements

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-improvements
          fetch-depth: 0

      - name: Configure legacy line endings
        run: git config core.whitespace cr-at-eol

      - name: Apply reliability changes
        run: python3 tools/apply_reliability.py

      - name: Apply legacy compatibility fixes
        run: |
          sed -i 's/^bool MOTOR_StartCloseReference/uint8_t MOTOR_StartCloseReference/' src/motor.h src/motor.c
          sed -i 's/^bool MOTOR_CloseReferenceActive/uint8_t MOTOR_CloseReferenceActive/' src/motor.h src/motor.c
          sed -i '/#pragma once/a #include "debug.h"' src/watch.h

      - name: Keep workflow creation outside Actions push
        run: rm -f .github/workflows/reliability-build.yml

      - name: Install pinned AVR toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck curl bzip2
          mkdir -p /tmp/avr-toolchain
          curl -fsSL https://downloads.arduino.cc/tools/avr-gcc-4.9.2-atmel3.5.3-arduino2-x86_64-pc-linux-gnu.tar.bz2 -o /tmp/avr-gcc.tar.bz2
          tar -xjf /tmp/avr-gcc.tar.bz2 -C /tmp/avr-toolchain
          AVR_GCC=$(find /tmp/avr-toolchain -type f -name avr-gcc -perm -111 | head -n1)
          test -n "$AVR_GCC"
          echo "$(dirname "$AVR_GCC")" >> "$GITHUB_PATH"
          "$AVR_GCC" --version

      - name: Build standalone HR20
        run: make HR20_original_sww REV=reliability

      - name: Static checks
        run: make check

      - name: Verify EEPROM layout
        run: bash tools/check_eeprom_layout.sh bin/HR20_original_sww/hr20.elf

      - name: Commit validated changes
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "feat: improve standalone HR20 reliability"
          git push origin HEAD:reliability-improvements
