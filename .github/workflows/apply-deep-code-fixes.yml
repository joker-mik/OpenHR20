name: Apply deep reliability fixes

on:
  push:
    branches:
      - reliability-improvements
    paths:
      - .github/workflows/apply-deep-code-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: reliability-improvements
          fetch-depth: 0

      - name: Apply fixes from staged payload
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import re
          import subprocess
          import zlib

          previous = subprocess.check_output([
              "git", "show",
              "d177b0e05121a2a52b0e4465f3a46a510112f877:.github/workflows/apply-deep-code-fixes.yml"
          ], text=True)
          match = re.search(r"payload = '''(.*?)'''", previous, re.S)
          if not match:
              raise SystemExit("staged patch payload not found")
          source = zlib.decompress(base64.b64decode(match.group(1)))
          exec(compile(source, "apply_deep_code_fixes.py", "exec"))
          PY

          # GitHub Actions tokens cannot update workflow files. The workflow
          # update is applied separately through the repository connector.
          git checkout -- .github/workflows/reliability-build.yml

      - name: Commit and push firmware fixes
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src common Makefile RELIABILITY.md doc/EEPROM_UART_Konfiguration.md
          git commit -m "fix: harden thermostat runtime paths"
          git push origin HEAD:reliability-improvements
