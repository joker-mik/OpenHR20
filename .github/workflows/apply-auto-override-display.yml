name: Apply AUTO override display

on:
  push:
    branches:
      - reliability-improvements
    paths:
      - .github/workflows/apply-auto-override-display.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: reliability-improvements
          fetch-depth: 0

      - name: Patch AUTO override display
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/menu.c")
          text = path.read_text()

          old = ("#if HR25\n"
                 "\t\t// day of week icon\n"
                 "\t\tLCD_SetSeg(LCD_SEG_D1 + RTC_GetDayOfWeek() - 1, LCD_MODE_ON);\n"
                 "#endif\n"
                 "\t\t// display active temperature type in automatic mode\n"
                 "\t\tif (CTL_test_auto())\n"
                 "\t\t{\n"
                 "\t\t\tshow_selected_temperature_type(CTL_temp_auto_type, LCD_MODE_ON);\n"
                 "\t\t}\n"
                 "\t\tLCD_PrintTemp(CTL_temp_wanted, LCD_MODE_ON);\n")

          new = ("#if HR25\n"
                 "\t\t// day of week icon\n"
                 "\t\tLCD_SetSeg(LCD_SEG_D1 + RTC_GetDayOfWeek() - 1, LCD_MODE_ON);\n"
                 "#endif\n"
                 "\t\t// A wheel change in AUTO is a temporary override until the next timer event.\n"
                 "\t\t// Blink AUTO at 0.5 Hz (1 s on / 1 s off) using the existing RTC tick,\n"
                 "\t\t// rather than the LCD frame blink mode, so the LCD frame interrupt can sleep.\n"
                 "\t\tif (CTL_mode_auto)\n"
                 "\t\t{\n"
                 "\t\t\tif ((CTL_temp_auto_type != TEMP_TYPE_INVALID) && !CTL_test_auto())\n"
                 "\t\t\t{\n"
                 "\t\t\t\tLCD_SetSeg(LCD_SEG_AUTO, (RTC_GetSecond() & 1) ? LCD_MODE_OFF : LCD_MODE_ON);\n"
                 "\t\t\t}\n"
                 "\t\t\telse\n"
                 "\t\t\t{\n"
                 "\t\t\t\tLCD_SetSeg(LCD_SEG_AUTO, LCD_MODE_ON);\n"
                 "\t\t\t}\n"
                 "\t\t}\n"
                 "\t\telse\n"
                 "\t\t{\n"
                 "\t\t\tLCD_SetSeg(LCD_SEG_AUTO, LCD_MODE_OFF);\n"
                 "\t\t}\n"
                 "\n"
                 "\t\t// Preset symbols identify the active schedule temperature only while the\n"
                 "\t\t// current target still matches that schedule. They stay off during override.\n"
                 "\t\tif (CTL_test_auto())\n"
                 "\t\t{\n"
                 "\t\t\tshow_selected_temperature_type(CTL_temp_auto_type, LCD_MODE_ON);\n"
                 "\t\t}\n"
                 "\t\telse\n"
                 "\t\t{\n"
                 "\t\t\tshow_selected_temperature_type(CTL_temp_auto_type, LCD_MODE_OFF);\n"
                 "\t\t}\n"
                 "\t\tLCD_PrintTemp(CTL_temp_wanted, LCD_MODE_ON);\n")

          if new in text:
              print("AUTO override display is already patched")
          elif old not in text:
              raise SystemExit("Expected menu.c display block not found")
          else:
              path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/menu.c
          git commit -m "feat: blink AUTO during temporary override"
          git push origin HEAD:reliability-improvements
