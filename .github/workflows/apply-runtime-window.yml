name: Apply runtime window mode

on:
  push:
    branches:
      - reliability-improvements
    paths:
      - tools/.runtime-window-trigger

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reliability-improvements
          fetch-depth: 0
      - name: Apply patch
        run: |
          base64 -d tools/apply_runtime_window_mode.py.gz.b64 | gzip -d > /tmp/apply_runtime_window_mode.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply_runtime_window_mode.py')
          s = p.read_text()
          a = s.index('    # CI explicitly confirms that the produced standalone image uses runtime selection.')
          b = s.index('    # Documentation:', a)
          p.write_text(s[:a] + s[b:])
          PY
          python3 /tmp/apply_runtime_window_mode.py
          rm -f tools/apply_runtime_window_mode.py.gz.b64 tools/.runtime-window-trigger
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: select window detection mode from EEPROM"
          git push origin HEAD:reliability-improvements
